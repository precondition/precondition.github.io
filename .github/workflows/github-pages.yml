name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  github-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: helaili/jekyll-action@v2
        with:
            target_branch: 'gh-pages'
            token: ${{ secrets.GITHUB_TOKEN }}
